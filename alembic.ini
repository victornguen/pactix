# Alembic configuration for pactix's outbox/inbox migrations.
#
# Set the database URL via the PACTIX_DATABASE_URL environment variable or by
# editing sqlalchemy.url below. Online upgrades use a synchronous driver, so use
# a postgresql:// (psycopg) or mysql+pymysql:// URL for `alembic upgrade`.

[alembic]
script_location = src/pactix/db/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
