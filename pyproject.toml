[project]
name = "pactix"
version = "0.1.0"
description = "Transactional outbox and inbox primitives for PostgreSQL, on SQLAlchemy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.10"]
http = ["httpx>=0.27", "starlette>=0.37"]
migrations = ["alembic>=1.13"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "testcontainers[postgresql]>=4.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "starlette>=0.37",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pactix"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pactix"]

[[tool.mypy.overrides]]
# Optional transport dependency; only present with the `kafka` extra.
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: integration tests that require a real PostgreSQL database",
]
